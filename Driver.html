<!DOCTYPE html>
<html lang="km">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ទូទាត់តាម ABA Mobile</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Battambang:wght@400;700&family=Noto+Sans+Khmer:wght@400;500;700&display=swap">
<style>
  body { font-family: 'Battambang', 'Noto Sans Khmer', system-ui, sans-serif; font-weight: 400; line-height: 1.7; background: #f2f4f7; margin: 0; display: flex; min-height: 100vh; align-items: center; justify-content: center; padding: 20px; box-sizing: border-box; }
  .card { background: #fff; border-radius: 16px; padding: 24px 20px; max-width: 380px; width: 100%; text-align: center; box-shadow: 0 6px 24px rgba(0,0,0,.08); }
  h1 { font-size: 18px; margin: 0 0 8px; color: #005e7b; }
  p { color: #667; font-size: 13.5px; line-height: 1.6; margin: 8px 0; }
  a.btn { display: block; background: #005e7b; color: #fff; text-decoration: none; font-weight: 800; padding: 15px; border-radius: 12px; margin-top: 16px; font-size: 15px; }
  a.alt { display: block; color: #005e7b; font-size: 13px; margin-top: 14px; }
</style>
</head>
<body>
<div class="card">
  <h1>💳 ទូទាត់តាម ABA Mobile</h1>
  <p id="msg">កំពុងបើក ABA Mobile... ប្រសិនបើមិនបើក សូមចុចប៊ូតុងខាងក្រោម។</p>
  <a class="btn" id="open" href="#">បើក ABA Mobile</a>
  <a class="alt" id="store" href="#" style="display:none">មិនទាន់មាន ABA Mobile? ដំឡើងទីនេះ</a>
  <p style="font-size:12px">បង់រួច សូមត្រឡប់ទៅ Telegram វិញ។ ការកម្មង់នឹងត្រូវបញ្ជាក់ដោយស្វ័យប្រវត្តិ។</p>
</div>
<script>
(function () {
  var API = 'https://lykgwttlhqedyrkxfoja.supabase.co/functions/v1/payment-status';
  var msg = document.getElementById('msg');
  var btn = document.getElementById('open');
  var store = document.getElementById('store');
  function stop(text) { msg.textContent = text; btn.style.display = 'none'; }

  // The address carries ONLY the order id, never a deeplink, so this page can only open
  // payments that our own system created.
  var o = new URLSearchParams(location.search).get('o') || '';
  if (!/^[A-Za-z0-9_-]{4,20}$/.test(o)) { stop('តំណភ្ជាប់មិនត្រឹមត្រូវ។ សូមត្រឡប់ទៅ Telegram ហើយស្កេន QR។'); return; }

  btn.style.display = 'none';
  fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ tran_id: o }) })
    .then(function (r) { return r.json(); })
    .then(function (j) {
      if (j.status === 'paid') { stop('✅ ការបង់ប្រាក់នេះបានបញ្ចប់ហើយ។ សូមត្រឡប់ទៅ Telegram។'); return; }
      if (j.status === 'expired') { stop('⌛ QR ផុតកំណត់ សូមត្រឡប់ទៅ Telegram ហើយកម្មង់ម្ដងទៀត។'); return; }
      var d = j.deeplink || '';
      // Defence in depth: only the ABA scheme, and no characters that could inject extra Android intent parameters.
      if (d.indexOf('abamobilebank://') !== 0 || d.length > 3000 || /[;#<>"'`\\\s]/.test(d)) {
        stop('តំណភ្ជាប់មិនត្រឹមត្រូវ។ សូមត្រឡប់ទៅ Telegram ហើយស្កេន QR។'); return;
      }
      var isAndroid = /Android/i.test(navigator.userAgent);
      var target = isAndroid
        ? 'intent://' + d.replace('abamobilebank://', '') + '#Intent;scheme=abamobilebank;package=com.paygo24.ibank;end'
        : d;
      btn.href = target; btn.style.display = 'block';
      store.href = isAndroid ? 'https://play.google.com/store/apps/details?id=com.paygo24.ibank'
                             : 'https://apps.apple.com/app/aba-mobile-bank/id968860649';
      store.style.display = 'block';
      setTimeout(function () { window.location.href = target; }, 400);
    })
    .catch(function () { stop('មិនអាចភ្ជាប់បានទេ។ សូមត្រឡប់ទៅ Telegram ហើយស្កេន QR។'); });
})();
</script>
</body>
</html>
